services:
  wisely:
    build: .
    restart: unless-stopped
    volumes:
      - wisely-data:/app/data
    environment:
      DATABASE_URL: "file:/app/data/wisely.db"
      AUTH_SECRET: ${AUTH_SECRET:?Set AUTH_SECRET in .env, e.g. openssl rand -base64 32}
    expose:
      - "3000"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3000/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      - wisely

volumes:
  wisely-data:
  caddy-data:
  caddy-config:
